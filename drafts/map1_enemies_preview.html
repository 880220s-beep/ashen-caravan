<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>초원 적 아트 시안</title>
<style>body{margin:0;background:#1b2430;color:#fff;font-family:sans-serif}canvas{display:block;margin:0 auto}</style></head><body><canvas id="c"></canvas>
<script>
const Q=new URLSearchParams(location.search),SHEET=Q.has('sheet');const cv=document.getElementById('c'),cx=cv.getContext('2d');const TAU=Math.PI*2,O='#142233';
const bg=new Image();bg.src='bg1b.jpg';const car=new Image();car.src='tank_lv1.png';
function E(x,y,rx,ry,a){cx.beginPath();cx.ellipse(x,y,rx,ry,a||0,0,TAU);}
function shadow(r,k){cx.fillStyle='rgba(0,0,0,.2)';E(r*.1,r*.25,r*(k||1.1),r*.75*(k||1));cx.fill();}
function legs(n,len,r,t,spd,col,xs,ys){cx.strokeStyle=O;cx.lineCap='round';for(let i=0;i<n;i++){const x=xs[i],s=i%2?1:-1,ph=Math.sin(t*spd+i*Math.PI*.5)*len*.5;for(const sd of[-1,1]){cx.lineWidth=r*.28;cx.beginPath();cx.moveTo(x,sd*ys);cx.lineTo(x+ph*sd*s,sd*(ys+len));cx.stroke();cx.strokeStyle=col;cx.lineWidth=r*.15;cx.stroke();cx.strokeStyle=O;}}}
/* 통통 들쥐: round body + thin tail */
function rat(r,t){shadow(r,1);const w=Math.sin(t*14);legs(2,r*.35,r*.5,t,16,'#C9A28A',[r*.45,-r*.45],r*.65);
 cx.strokeStyle=O;cx.lineWidth=r*.16;cx.lineCap='round';cx.beginPath();cx.moveTo(-r*.9,0);cx.bezierCurveTo(-r*1.5,w*r*.5,-r*1.8,-w*r*.4,-r*2.2,w*r*.3);cx.stroke();cx.strokeStyle='#D9A8A0';cx.lineWidth=r*.07;cx.stroke();
 cx.fillStyle='#8A7868';cx.strokeStyle=O;cx.lineWidth=r*.13;E(0,0,r,r*.9);cx.fill();cx.stroke();cx.fillStyle='#A39282';E(-r*.1,-r*.25,r*.6,r*.4);cx.fill();
 cx.fillStyle='#6E6E78';cx.fillRect(-r*.55,r*.05,r*.42,r*.34);cx.strokeStyle=O;cx.lineWidth=r*.06;cx.strokeRect(-r*.55,r*.05,r*.42,r*.34);cx.fillStyle='#C9CED6';for(const q of[[-.5,.1],[-.18,.1],[-.5,.33],[-.18,.33]]){cx.beginPath();cx.arc(q[0]*r,q[1]*r,r*.04,0,TAU);cx.fill();}
 for(const s of[-1,1]){cx.fillStyle='#8A7868';cx.strokeStyle=O;cx.lineWidth=r*.1;E(r*.22,s*r*.78,r*.34,r*.3,s*.5);cx.fill();cx.stroke();cx.fillStyle='#E8B8B0';E(r*.24,s*r*.8,r*.2,r*.16,s*.5);cx.fill();}
 cx.fillStyle='#142233';for(const s of[-1,1]){cx.beginPath();cx.arc(r*.8,s*r*.22,r*.08,0,TAU);cx.fill();}cx.fillStyle='#fff';for(const s of[-1,1]){cx.beginPath();cx.arc(r*.82,s*r*.22-r*.03,r*.03,0,TAU);cx.fill();}
 cx.fillStyle='#E88A9A';cx.beginPath();cx.arc(r*1.0,0,r*.13,0,TAU);cx.fill();cx.strokeStyle=O;cx.lineWidth=r*.05;cx.stroke();}
/* 들개: wedge body, pack */
function dog(r,t){shadow(r,1.1);const ph=t*16;
 for(const[x,o]of[[r*.45,0],[-r*.55,Math.PI]])for(const sd of[-1,1]){const k=Math.sin(ph+o+(sd>0?Math.PI:0))*r*.18;cx.strokeStyle=O;cx.lineCap='round';cx.lineWidth=r*.26;cx.beginPath();cx.moveTo(x,sd*r*.3);cx.lineTo(x+k,sd*r*.62);cx.stroke();cx.strokeStyle='#8A6438';cx.lineWidth=r*.13;cx.stroke();}
 const wg=Math.sin(t*20)*.45;cx.save();cx.translate(-r*.95,0);cx.rotate(wg);cx.strokeStyle=O;cx.lineWidth=r*.22;cx.beginPath();cx.moveTo(0,0);cx.quadraticCurveTo(-r*.3,-r*.1,-r*.55,r*.05);cx.stroke();cx.strokeStyle='#B08A5A';cx.lineWidth=r*.11;cx.stroke();cx.restore();
 cx.fillStyle='#A07A4A';cx.strokeStyle=O;cx.lineWidth=r*.15;E(-r*.15,0,r*.9,r*.42);cx.fill();cx.stroke();
 cx.fillStyle='#D9BE8E';E(-r*.1,r*.12,r*.6,r*.18);cx.fill();cx.fillStyle='#6E4E2C';E(-r*.25,-r*.06,r*.65,r*.16);cx.fill();cx.fillStyle='#5E4A3A';cx.fillRect(-r*.6,-r*.3,r*.26,r*.16);
 cx.fillStyle='#A07A4A';cx.strokeStyle=O;cx.lineWidth=r*.13;cx.beginPath();cx.moveTo(r*.5,-r*.2);cx.lineTo(r*.5,r*.2);cx.lineTo(r*.75,r*.24);cx.lineTo(r*.75,-r*.24);cx.closePath();cx.fill();cx.stroke();
 cx.strokeStyle='#8A4A2A';cx.lineWidth=r*.14;cx.beginPath();cx.moveTo(r*.58,-r*.26);cx.lineTo(r*.58,r*.26);cx.stroke();cx.fillStyle='#C9CED6';for(const y of[-.2,.2]){cx.beginPath();cx.moveTo(r*.58,y*r-r*.06);cx.lineTo(r*.42,y*r);cx.lineTo(r*.58,y*r+r*.06);cx.fill();}
 cx.fillStyle='#A07A4A';cx.strokeStyle=O;cx.lineWidth=r*.13;E(r*.95,0,r*.34,r*.3);cx.fill();cx.stroke();
 cx.fillStyle='#C9A878';cx.beginPath();cx.moveTo(r*1.1,-r*.16);cx.lineTo(r*1.5,-r*.09);cx.lineTo(r*1.5,r*.09);cx.lineTo(r*1.1,r*.16);cx.closePath();cx.fill();cx.stroke();cx.fillStyle='#142233';cx.beginPath();cx.arc(r*1.5,0,r*.08,0,TAU);cx.fill();
 for(const s of[-1,1]){cx.fillStyle='#6E4E2C';cx.strokeStyle=O;cx.lineWidth=r*.09;cx.beginPath();cx.moveTo(r*.95,s*r*.18);cx.lineTo(r*.7,s*r*.5);cx.lineTo(r*.82,s*r*.12);cx.closePath();cx.fill();cx.stroke();}
 cx.fillStyle='#F2C94C';for(const s of[-1,1]){cx.beginPath();cx.arc(r*1.08,s*r*.13,r*.065,0,TAU);cx.fill();}cx.fillStyle='#142233';for(const s of[-1,1]){cx.fillRect(r*1.07,s*r*.13-r*.04,r*.035,r*.08);}}
/* 엄니 멧돼지: wide oval + two tusks */
function boar(r,t,king){shadow(r,1.25);const B=king?'#4E3A30':'#6A4E3E',B2=king?'#3A2A22':'#4E3A2E';legs(2,r*.3,r*.5,t,11,B2,[r*.55,-r*.55],r*.62);
 cx.strokeStyle=O;cx.lineWidth=r*.07;cx.beginPath();cx.moveTo(-r*1.05,0);cx.quadraticCurveTo(-r*1.3,Math.sin(t*9)*r*.15,-r*1.35,r*.08);cx.stroke();
 cx.fillStyle=B;cx.strokeStyle=O;cx.lineWidth=r*.15;E(0,0,r*1.15,r*.8);cx.fill();cx.stroke();cx.fillStyle=king?'#7A6050':'#A08470';E(0,r*.42,r*.85,r*.26);cx.fill();cx.strokeStyle='rgba(255,230,200,.35)';cx.lineWidth=r*.06;E(0,0,r*1.05,r*.7);cx.stroke();
 cx.fillStyle=B2;for(let i=0;i<9;i++){const x=-r*.85+i*r*.2;cx.beginPath();cx.moveTo(x-r*.08,-r*.06);cx.lineTo(x,-r*.28-(i%2)*r*.08);cx.lineTo(x+r*.08,-r*.06);cx.closePath();cx.fill();}
 if(king){cx.fillStyle='#7C858E';cx.strokeStyle=O;cx.lineWidth=r*.06;cx.beginPath();cx.roundRect(-r*.65,-r*.55,r*.9,r*1.1,r*.12);cx.fill();cx.stroke();cx.fillStyle='#A8603A';cx.beginPath();cx.arc(-r*.35,r*.25,r*.12,0,TAU);cx.arc(0,-r*.3,r*.08,0,TAU);cx.fill();cx.fillStyle='#C9CED6';for(const q of[[-.55,-.45],[.15,-.45],[-.55,.45],[.15,.45]]){cx.beginPath();cx.arc(q[0]*r,q[1]*r,r*.05,0,TAU);cx.fill();}cx.strokeStyle='#5E3A1C';cx.lineWidth=r*.1;cx.beginPath();cx.moveTo(r*.35,-r*.78);cx.lineTo(r*.35,r*.78);cx.stroke();
  cx.strokeStyle='#C9A28A';cx.lineWidth=r*.05;cx.beginPath();cx.moveTo(-r*.95,r*.15);cx.lineTo(-r*.7,r*.4);cx.moveTo(-r*.9,r*.35);cx.lineTo(-r*.75,r*.25);cx.stroke();}
 else{cx.strokeStyle='#8A6A58';cx.lineWidth=r*.05;cx.beginPath();cx.moveTo(-r*.3,r*.35);cx.lineTo(r*.1,r*.5);cx.stroke();cx.fillStyle='#8A4A2A';cx.fillRect(-r*.75,r*.1,r*.25,r*.18);}
 cx.fillStyle=B;cx.strokeStyle=O;cx.lineWidth=r*.1;E(r*.95,0,r*.42,r*.5);cx.fill();cx.stroke();for(const s of[-1,1]){cx.fillStyle=B2;cx.beginPath();cx.moveTo(r*.85,s*r*.35);cx.lineTo(r*.6,s*r*.68);cx.lineTo(r*.75,s*r*.3);cx.closePath();cx.fill();cx.stroke();}
 cx.fillStyle='#D9A8A0';cx.strokeStyle=O;cx.lineWidth=r*.07;E(r*1.32,0,r*.13,r*.2);cx.fill();cx.stroke();cx.fillStyle='#5E3A3A';for(const s of[-1,1]){cx.beginPath();cx.arc(r*1.34,s*r*.07,r*.035,0,TAU);cx.fill();}
 cx.fillStyle=king?'#E8452C':'#142233';for(const s of[-1,1]){cx.beginPath();cx.arc(r*1.05,s*r*.24,r*.07,0,TAU);cx.fill();}
 for(const s of[-1,1]){const broken=king&&s>0;cx.fillStyle='#F4EEDC';cx.strokeStyle=O;cx.lineWidth=r*.06;cx.beginPath();cx.moveTo(r*1.22,s*r*.15);if(broken){cx.lineTo(r*1.42,s*r*.28);cx.lineTo(r*1.38,s*r*.36);cx.lineTo(r*1.18,s*r*.27);}else{cx.quadraticCurveTo(r*1.55,s*r*.22,r*1.62,s*r*.48);cx.quadraticCurveTo(r*1.45,s*r*.32,r*1.18,s*r*.27);}cx.closePath();cx.fill();cx.stroke();}}
/* 굴렁왕: giant pill bug, iron-plate shell, rolls */
function bug(r,t,roll){shadow(r,1.25);if(roll){const a=t*6;cx.fillStyle='#6E7780';cx.strokeStyle=O;cx.lineWidth=r*.1;cx.beginPath();cx.arc(0,0,r*.95,0,TAU);cx.fill();cx.stroke();cx.save();cx.beginPath();cx.arc(0,0,r*.95,0,TAU);cx.clip();for(let i=-4;i<=4;i++){const x=((i*r*.32+a*r*.3)%(r*2.6))-r*1.3;cx.fillStyle=i%2?'#7C858E':'#8E979F';cx.fillRect(x,-r,r*.3,r*2);cx.strokeStyle=O;cx.lineWidth=r*.05;cx.beginPath();cx.moveTo(x,-r);cx.lineTo(x,r);cx.stroke();cx.fillStyle='#C9CED6';cx.beginPath();cx.arc(x+r*.15,-r*.5,r*.04,0,TAU);cx.arc(x+r*.15,r*.5,r*.04,0,TAU);cx.fill();}cx.fillStyle='#A8603A';cx.globalAlpha=.7;cx.beginPath();cx.arc(-r*.2,r*.3,r*.15,0,TAU);cx.fill();cx.globalAlpha=1;cx.restore();cx.fillStyle='rgba(255,255,255,.18)';E(-r*.3,-r*.35,r*.4,r*.2,-.4);cx.fill();return;}
 for(let i=0;i<7;i++){const x=r*.8-i*r*.27,ph=Math.sin(t*14+i*.9)*r*.1;for(const s of[-1,1]){cx.strokeStyle=O;cx.lineWidth=r*.1;cx.lineCap='round';cx.beginPath();cx.moveTo(x,s*r*.55);cx.lineTo(x+ph,s*r*.82);cx.stroke();cx.strokeStyle='#4A3A30';cx.lineWidth=r*.05;cx.stroke();}}
 for(const s of[-1,1]){cx.strokeStyle=O;cx.lineWidth=r*.06;cx.beginPath();cx.moveTo(r*1.1,s*r*.15);cx.quadraticCurveTo(r*1.5,s*r*(.3+.05*Math.sin(t*4)),r*1.7,s*r*.55);cx.stroke();}
 cx.fillStyle='#3E3A3A';cx.strokeStyle=O;cx.lineWidth=r*.1;E(r*1.0,0,r*.28,r*.42);cx.fill();cx.stroke();cx.fillStyle='#F2C94C';for(const s of[-1,1]){cx.beginPath();cx.arc(r*1.1,s*r*.2,r*.07,0,TAU);cx.fill();}
 cx.fillStyle='#6E7780';cx.strokeStyle=O;cx.lineWidth=r*.12;E(0,0,r*1.1,r*.68);cx.fill();cx.stroke();
 cx.save();E(0,0,r*1.1,r*.68);cx.clip();for(let i=0;i<8;i++){const x=r*.95-i*r*.28;cx.fillStyle=i%2?'#7C858E':'#8E979F';cx.beginPath();cx.ellipse(x,0,r*.2,r*.75,0,-Math.PI/2,Math.PI/2);cx.lineTo(x-r*.28,r*.75);cx.lineTo(x-r*.28,-r*.75);cx.closePath();cx.fill();cx.strokeStyle=O;cx.lineWidth=r*.05;cx.beginPath();cx.ellipse(x,0,r*.2,r*.75,0,-Math.PI/2,Math.PI/2);cx.stroke();cx.fillStyle='#C9CED6';for(const y of[-.42,.42]){cx.beginPath();cx.arc(x-r*.06,y*r,r*.035,0,TAU);cx.fill();}}
 cx.fillStyle='rgba(168,96,58,.75)';for(const q of[[-.4,.3,.14],[.3,-.35,.1],[-.75,-.2,.09]]){cx.beginPath();cx.arc(q[0]*r,q[1]*r,q[2]*r,0,TAU);cx.fill();}cx.fillStyle='rgba(255,255,255,.16)';E(-r*.1,-r*.32,r*.7,r*.14);cx.fill();cx.restore();
 cx.strokeStyle=O;cx.lineWidth=r*.12;E(0,0,r*1.1,r*.68);cx.stroke();}
const LIST=[['통통 들쥐','rat',13,'일반 · HP1.0 / 속도1.0'],['들개','dog',15,'일반 · 무리 · 빠름'],['엄니 멧돼지','boar',26,'일반 · 직선 돌진'],['왕엄니','king',52,'중보스 · 한쪽 엄니 부러짐'],['굴렁왕','bug',80,'보스 · 철판 공벌레'],['굴렁왕 (구르기)','roll',72,'보스 · 굴러박기']];
function drawOne(k,r,t){if(k==='rat')rat(r,t);else if(k==='dog')dog(r,t);else if(k==='boar')boar(r,t,0);else if(k==='king')boar(r,t,1);else if(k==='bug')bug(r,t,0);else bug(r,t,1);}
function grassFill(x,y,w,h){if(bg.complete&&bg.width){const p=cx.createPattern(bg,'repeat');cx.save();cx.translate(x,y);cx.fillStyle=p;cx.fillRect(0,0,w,h);cx.restore();}else{cx.fillStyle='#8fd36a';cx.fillRect(x,y,w,h);}}
function carAt(x,y,h,a){if(!car.complete)return;cx.save();cx.translate(x,y);cx.rotate(a);const w=h*car.width/car.height;cx.drawImage(car,-w/2,-h/2,w,h);cx.restore();}
function sheet(t){const W=1500,H=980;cv.width=W;cv.height=H;cx.fillStyle='#1b2430';cx.fillRect(0,0,W,H);cx.fillStyle='#fff';cx.font='bold 26px sans-serif';cx.fillText('1 초원 적 아트 시안 (코드 드로잉, 게임 내 탑다운 스타일)',24,40);
 cx.font='16px sans-serif';cx.fillStyle='#c9d3de';cx.fillText('위: 게임 내 크기, 초원 배경, 플레이어 차량 옆 / 아래: 확대(이름·역할)',24,66);
 grassFill(20,84,W-40,380);cx.strokeStyle='#142233';cx.lineWidth=3;cx.strokeRect(20,84,W-40,380);
 carAt(110,280,56,-Math.PI/2);cx.fillStyle='#fff';cx.font='bold 14px sans-serif';cx.strokeStyle='#142233';cx.lineWidth=3;cx.strokeText('플레이어',80,330);cx.fillText('플레이어',80,330);
 const pos=[[230,230],[330,320],[470,260],[680,280],[1000,280],[1300,280]];
 LIST.forEach(([n,k,r],i)=>{const[x,y]=pos[i];cx.save();cx.translate(x,y);cx.rotate(Math.PI);drawOne(k,r,t+i);cx.restore();cx.font='bold 14px sans-serif';cx.strokeStyle='#142233';cx.lineWidth=3;const ty=y+r*1.25+22;cx.strokeText(n,x-cx.measureText(n).width/2,ty);cx.fillStyle='#fff';cx.fillText(n,x-cx.measureText(n).width/2,ty);});
 // pack of dogs + rats swarm small
 for(let i=0;i<4;i++){cx.save();cx.translate(300+i*34,150+(i%2)*26);cx.rotate(Math.PI*.9);dog(15,t+i*.7);cx.restore();}for(let i=0;i<5;i++){cx.save();cx.translate(160+i*26,420-(i%2)*20);cx.rotate(-Math.PI/2);rat(13,t+i);cx.restore();}
 const cw=(W-40)/6;LIST.forEach(([n,k,r,d],i)=>{const x=20+cw*i,y=490;cx.fillStyle=i%2?'#26303e':'#222b38';cx.fillRect(x,y,cw-6,470);const pr=Math.min(cw*.3,r*(k==='rat'||k==='dog'?4:k==='boar'?2.2:k==='king'?1.3:1.0));cx.save();grassFill(x+8,y+8,cw-22,330);cx.restore();cx.save();cx.translate(x+cw/2-3,y+175);cx.rotate(Math.PI);drawOne(k,pr,t+i);cx.restore();
  cx.fillStyle='#fff';cx.font='bold 20px sans-serif';cx.fillText(n,x+12,y+372);cx.font='14px sans-serif';cx.fillStyle='#c9d3de';cx.fillText(d,x+12,y+396);cx.fillText('게임 내 반경 r≈'+r+'px',x+12,y+418);});}
let T0=performance.now();
function loop(now){const t=(now-T0)/1000;if(SHEET){sheet(Q.has('t')?+Q.get('t'):t);}else{const W=Math.min(innerWidth,900),H=Math.min(innerHeight,1400);cv.width=W;cv.height=H;grassFill(0,0,W,H);const cxp=W/2,cyp=H/2;carAt(cxp,cyp,56,t*.3);
  LIST.forEach(([n,k,r],i)=>{const R=90+i*60+(k==='bug'||k==='roll'?40:0),sp=(k==='dog'?.8:k==='rat'?.6:k==='roll'?.9:.35)*(i%2?1:-1),a=t*sp+i*1.3;const x=cxp+Math.cos(a)*R,y=cyp+Math.sin(a)*R*.9;cx.save();cx.translate(x,y);cx.rotate(a+Math.PI/2*(sp>0?1:-1));drawOne(k,r,t+i);cx.restore();cx.fillStyle='#fff';cx.strokeStyle='#142233';cx.lineWidth=3;cx.font='bold 12px sans-serif';cx.strokeText(n,x-20,y-r-10);cx.fillText(n,x-20,y-r-10);});}
 requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
