 {const h=q('eyeH'),e=q('eye');for(const s of[-1,1]){if(h>0){pC(19,s*4.5,2.2,'#0D0907',1);pC(19,s*4.5,1.5*Math.min(1,h),e>0?AM:'#7a5a2a',0);if(e>0){cx.globalAlpha=.35*e;pC(19,s*4.5,4,'#FFD58A',0);cx.globalAlpha=1;}}pJ(19-4*h,s*4.5,0,()=>pR(-2.2,-2.4,4.4,4.8,2,FD,1));}

 {const jl=4*q('jawL'),te=q('teeth'),jo=q('jawO'),len=18+jl;

  const h=q('eyeH'),e=q('eye'),b=q('brow');for(const s of[-1,1]){pE(15,s*4.6,3+1*b,2.6+.6*b,CL,1.1);if(h>0){pE(15.5,s*4.6,1.9*Math.min(1,h),1.5,e>0?AM:'#7a6a2a',0);pR(15.1,s*4.6-1.2,.8,2.4,.4,'#151515',0);if(e>0){cx.globalAlpha=.35*e;pC(15.5,s*4.6,3.6,'#FFE08A',0);cx.globalAlpha=1;}}pJ(15-4.5*h,s*4.6,0,()=>pE(0,0,2.4,2.2,C,.9));}}}
