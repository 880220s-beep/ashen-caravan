<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>잿빛 황야 · map3 preview</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#l{position:fixed;left:8px;bottom:6px;color:#fff8;font:11px sans-serif}</style></head><body><canvas id="c"></canvas><div id="l">map3 preview · 잿빛 황야 · art only</div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d'),TAU=Math.PI*2,OL='#142233';let W,H,D;
function rs(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0);}addEventListener('resize',()=>{rs();bake();});rs();
let sd=7;const rn=()=>(sd=(sd*16807)%2147483647)/2147483647;
const TILE=1024;let G;
function bake(){sd=7;G=document.createElement('canvas');G.width=G.height=TILE;const g=G.getContext('2d');
 g.fillStyle='#66605B';g.fillRect(0,0,TILE,TILE);
 /* broad variation blotches */for(let i=0;i<46;i++){g.fillStyle=['#6B655F','#605A55','#6B655F'][i%3];g.beginPath();g.ellipse(rn()*TILE,rn()*TILE,60+rn()*140,30+rn()*70,rn()*3,0,TAU);g.fill();}
 /* drift shadows + crest strokes */for(let i=0;i<26;i++){const x=rn()*TILE,y=rn()*TILE,w=80+rn()*120;g.strokeStyle='#59534F';g.lineWidth=6;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+w/2,y-12,x+w,y);g.stroke();g.strokeStyle='#79726B';g.lineWidth=2.5;g.beginPath();g.moveTo(x+6,y-5);g.quadraticCurveTo(x+w/2,y-16,x+w-6,y-5);g.stroke();}
 /* soot specks */g.fillStyle='#4A4440';for(let i=0;i<260;i++){g.beginPath();g.arc(rn()*TILE,rn()*TILE,1+rn()*2,0,TAU);g.fill();}
 g.fillStyle='#79726B';for(let i=0;i<160;i++){g.fillRect(rn()*TILE,rn()*TILE,2,2);}
 /* old tyre tracks */g.strokeStyle='rgba(74,68,64,.55)';g.lineWidth=5;g.setLineDash([10,7]);for(const o of[0,22]){g.beginPath();g.moveTo(-20,300+o);g.bezierCurveTo(300,220+o,600,460+o,TILE+20,360+o);g.stroke();}g.setLineDash([]);
 const fo='rgba(20,34,51,.25)';
 /* rust wrecks: low, half-buried */const wreck=(x,y,s,a)=>{g.save();g.translate(x,y);g.rotate(a);g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.ellipse(4,s*.35,s*1.15,s*.45,0,0,TAU);g.fill();g.fillStyle='#7A4632';g.strokeStyle=fo;g.lineWidth=2;g.beginPath();g.moveTo(-s,s*.2);g.lineTo(-s*.75,-s*.25);g.lineTo(s*.2,-s*.35);g.lineTo(s*.55,-s*.1);g.lineTo(s,s*.2);g.closePath();g.fill();g.stroke();g.fillStyle='#5E3426';g.fillRect(-s*.55,-s*.18,s*.3,s*.18);g.fillRect(-s*.1,-s*.22,s*.3,s*.2);g.fillStyle='#8E5A42';g.fillRect(-s*.9,s*.05,s*1.8,s*.07);g.fillStyle='#59534F';g.beginPath();g.ellipse(0,s*.25,s*1.1,s*.16,0,0,TAU);g.fill();g.fillStyle='rgba(255,140,60,.35)';g.beginPath();g.arc(-s*.4,-s*.08,3,0,TAU);g.fill();g.restore();};
 const tyre=(x,y,s)=>{g.strokeStyle='#3F3A37';g.lineWidth=s*.35;g.beginPath();g.arc(x,y,s,Math.PI*1.05,Math.PI*1.95);g.stroke();};
 const tree=(x,y,s)=>{g.save();g.translate(x,y);g.fillStyle='rgba(0,0,0,.16)';g.beginPath();g.ellipse(s*.3,2,s*.8,s*.2,0,0,TAU);g.fill();g.strokeStyle='#433C39';g.lineCap='round';const br=(l,a,w,d)=>{if(d>3)return;g.lineWidth=w;const ex=Math.sin(a)*l,ey=-Math.cos(a)*l;g.beginPath();g.moveTo(0,0);g.lineTo(ex,ey);g.stroke();g.save();g.translate(ex,ey);br(l*.62,a-.55,w*.6,d+1);br(l*.58,a+.5,w*.6,d+1);g.restore();};br(s,.08,s*.16,0);g.restore();};
 const bone=(x,y,s)=>{g.strokeStyle='#857E74';g.lineWidth=3;g.lineCap='round';for(let i=0;i<4;i++){g.beginPath();g.arc(x+i*s*.35,y,s*.5,Math.PI*1.15,Math.PI*1.85);g.stroke();}};
 const cinder=(x,y,s)=>{g.fillStyle='#4A4440';g.strokeStyle=fo;g.lineWidth=1.5;g.beginPath();g.ellipse(x,y,s,s*.45,0,0,TAU);g.fill();g.stroke();g.fillStyle='#59534F';g.beginPath();g.ellipse(x-s*.2,y-s*.1,s*.5,s*.2,0,0,TAU);g.fill();};
 const crater=(x,y,s)=>{g.strokeStyle='#59534F';g.lineWidth=4;g.beginPath();g.ellipse(x,y,s,s*.55,0,0,TAU);g.stroke();g.strokeStyle='#79726B';g.lineWidth=2;g.beginPath();g.ellipse(x,y-2,s,s*.55,0,Math.PI*1.1,Math.PI*1.9);g.stroke();};
 const P=[];const put=(f,s)=>{for(let k=0;k<30;k++){const x=60+rn()*(TILE-120),y=60+rn()*(TILE-120);if(P.every(p=>Math.hypot(p[0]-x,p[1]-y)>170)){P.push([x,y]);f(x,y,s);return;}}};
 for(let i=0;i<5;i++)put((x,y)=>wreck(x,y,34+rn()*18,rn()-.5));for(let i=0;i<4;i++)put((x,y)=>tree(x,y,38+rn()*16));for(let i=0;i<3;i++)put((x,y)=>crater(x,y,30+rn()*16));for(let i=0;i<3;i++)put((x,y)=>cinder(x,y,16+rn()*8));for(let i=0;i<2;i++)put((x,y)=>bone(x,y,22));for(let i=0;i<3;i++)put((x,y)=>tyre(x,y,12));}
bake();
const car=new Image();car.src='assets/car_tank_3.png';
const EN=[];for(let i=0;i<12;i++){const a=i/12*TAU+.3,d=150+(i%3)*45;EN.push({a,d,br:i%5==0,ph:i});}
let B=[],FB=[],t0=performance.now();
function grunt(x,y,s,ph,t){cx.save();cx.translate(x,y);cx.fillStyle='rgba(0,0,0,.25)';cx.beginPath();cx.ellipse(0,s*.9,s*.9,s*.3,0,0,TAU);cx.fill();cx.fillStyle='#3B6FE0';cx.strokeStyle=OL;cx.lineWidth=2.5;const bb=Math.sin(t*8+ph)*1.5;for(const sd of[-1,1]){cx.beginPath();cx.ellipse(sd*s*.85,bb,s*.35,s*.22,sd*.6,0,TAU);cx.fill();cx.stroke();}cx.beginPath();cx.ellipse(0,bb,s*.62,s*.7,0,0,TAU);cx.fill();cx.stroke();cx.fillStyle='#7FB2FF';cx.beginPath();cx.ellipse(-s*.18,bb-s*.3,s*.22,s*.14,0,0,TAU);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(0,bb-s*.05,s*.24,0,TAU);cx.fill();cx.stroke();cx.fillStyle='#E0245E';cx.beginPath();cx.arc(0,bb-s*.05,s*.11,0,TAU);cx.fill();cx.restore();}
function brute(x,y,s,ph,t){cx.save();cx.translate(x,y);cx.fillStyle='rgba(0,0,0,.25)';cx.beginPath();cx.ellipse(0,s*.8,s,s*.3,0,0,TAU);cx.fill();cx.fillStyle='#8A5A34';cx.strokeStyle=OL;cx.lineWidth=2.5;for(const sd of[-1,1]){cx.beginPath();cx.moveTo(sd*s*.3,0);cx.lineTo(sd*s*1.2,-s*.5+Math.sin(t*6+ph)*3);cx.lineTo(sd*s*1.1,s*.4);cx.closePath();cx.fill();cx.stroke();}cx.beginPath();cx.ellipse(0,0,s*.6,s*.7,0,0,TAU);cx.fill();cx.stroke();cx.fillStyle='#FFD34A';for(const sd of[-1,1]){cx.beginPath();cx.arc(sd*s*.2,-s*.15,s*.1,0,TAU);cx.fill();}cx.restore();}
function frame(now){const t=(now-t0)/1000;const cxp=W/2,cyp=H/2;
 const ox=(t*28)%TILE,oy=(t*-40)%TILE;cx.save();cx.translate(-ox-TILE,-oy-TILE);for(let i=0;i<Math.ceil(W/TILE)+3;i++)for(let j=0;j<Math.ceil(H/TILE)+3;j++)cx.drawImage(G,i*TILE,j*TILE);cx.restore();
 /* firebomb puddle */const fbx=cxp-90,fby=cyp+120,pr=46+Math.sin(t*4)*3;cx.save();cx.globalAlpha=.9;cx.fillStyle='#E8452C';cx.strokeStyle='rgba(20,34,51,.7)';cx.lineWidth=2;cx.beginPath();for(let i=0;i<=24;i++){const a=i/24*TAU,r=pr*(1+.08*Math.sin(a*5+t*6));cx.lineTo(fbx+Math.cos(a)*r,fby+Math.sin(a)*r*.6);}cx.fill();cx.stroke();cx.fillStyle='#FF8A1F';cx.beginPath();cx.ellipse(fbx,fby,pr*.65,pr*.38,0,0,TAU);cx.fill();cx.fillStyle='#FFB547';cx.beginPath();cx.ellipse(fbx,fby,pr*.32,pr*.18,0,0,TAU);cx.fill();for(let i=0;i<6;i++){const a=t*3+i,fx=fbx+Math.cos(a*1.7)*pr*.5,fy=fby-((t*60+i*20)%50);cx.globalAlpha=.8;cx.fillStyle=i%2?'#FFB547':'#fff3c0';cx.beginPath();cx.arc(fx,fy,4,0,TAU);cx.fill();}cx.restore();
 /* lion flame cone toward upper right */const fa=-.6+Math.sin(t*1.3)*.3;cx.save();cx.translate(cxp,cyp);cx.rotate(fa);for(let i=0;i<14;i++){const k=((t*2.2+i/14)%1),r=10+k*170,sp=(i%3-1)*.12*k*170;cx.globalAlpha=1-k*.8;cx.fillStyle=k<.25?'#FFF3C0':k<.55?'#FFB547':'#FF8A1F';cx.strokeStyle='rgba(20,34,51,.7)';cx.lineWidth=2;cx.beginPath();cx.arc(r,sp,7+k*16,0,TAU);cx.fill();if(k<.3)cx.stroke();}cx.restore();
 /* enemies */EN.forEach((e,i)=>{const a=e.a+t*.15,d=e.d+Math.sin(t+i)*10;e.x=cxp+Math.cos(a)*d;e.y=cyp+Math.sin(a)*d*1.3;(e.br?brute:grunt)(e.x,e.y,e.br?20:14,e.ph,t);});
 /* enemy bullets */if(Math.random()<.12){const e=EN[(Math.random()*EN.length)|0];const a=Math.atan2(cyp-e.y,cxp-e.x);B.push({x:e.x,y:e.y,vx:Math.cos(a)*150,vy:Math.sin(a)*150});}
 B=B.filter(b=>{b.x+=b.vx/60;b.y+=b.vy/60;if(Math.hypot(b.x-cxp,b.y-cyp)<28)return false;cx.fillStyle=OL;cx.beginPath();cx.arc(b.x,b.y,7,0,TAU);cx.fill();cx.fillStyle='#FF3D6E';cx.beginPath();cx.arc(b.x,b.y,5,0,TAU);cx.fill();cx.fillStyle='#FFE1EA';cx.beginPath();cx.arc(b.x-1,b.y-1,2,0,TAU);cx.fill();return true;});
 /* lion */cx.save();cx.translate(cxp,cyp);cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();cx.ellipse(4,22,34,12,0,0,TAU);cx.fill();if(car.complete&&car.naturalWidth){const s=78/Math.max(car.naturalWidth,car.naturalHeight);cx.rotate(fa+Math.PI/2);cx.drawImage(car,-car.naturalWidth*s/2,-car.naturalHeight*s/2,car.naturalWidth*s,car.naturalHeight*s);}cx.restore();
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
