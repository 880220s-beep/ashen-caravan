// ===== v56 lion-style AI art sprites (3/4 art, faces left; flipped horizontally to face movement) =====
const LSPR=LSPR_SRC.map(u=>{const i=new Image();i.src=u;return i;});
const LMZ=[[[.03,.42]],[[.04,.38],[.07,.43]],[[.09,.36]],[[.12,.58]],[[.17,.06],[.27,.04]]];/* muzzle points (u,v) in left-facing sprite */
function lsOK(i){const im=LSPR[i];return im&&im.complete&&im.naturalWidth>0;}
function lsIdx(){return G.l20?4:G.veh;}
function lsW(i){return (i>=4?2.75:2.5)*RTAB()[Math.min(3,i)];}
function lsFace(){const c=Math.cos(P.ang);if(c>.2)G.lface=1;else if(c<-.2)G.lface=-1;return G.lface||-1;}
function lsDraw(i,W,fl,opt){const im=LSPR[i],H=W*im.naturalHeight/im.naturalWidth,o=opt||{};cx.save();if(fl===1)cx.scale(-1,1);cx.translate(0,-H*.12);
 if(o.slices){const n=3,sw=im.naturalWidth/n;for(let k=0;k<n;k++){const q=o.slices[k];if(!q||q.a<=0)continue;cx.save();cx.globalAlpha*=q.a;cx.translate(-W/2+(k+.5)*W/n+q.x,q.y);cx.rotate(q.r);cx.drawImage(im,k*sw,0,sw,im.naturalHeight,-W/n/2-.5,-H/2,W/n+1,H);cx.restore();}}
 else cx.drawImage(im,-W/2,-H/2,W,H);
 if(o.flash>0){cx.globalCompositeOperation='source-atop';}
 cx.restore();return H;}
function lsMuzzle(i){const v=lsIdx(),im=LSPR[v];if(!lsOK(v))return null;const W=lsW(v),H=W*im.naturalHeight/im.naturalWidth,m=LMZ[v][i%LMZ[v].length],f=lsFace();return{x:P.x+(m[0]-.5)*W*(f===1?-1:1),y:P.y+(m[1]-.5)*H-H*.12};}
/* 3s slice transform: from stage a to b */
function drawLTF(f,a,b,strong){const u=f.t,cl=(p,q)=>Math.max(0,Math.min(1,(u-p)/(q-p))),eo=x=>1-Math.pow(1-x,3),fl=lsFace();
 f.evL=f.evL||{};const go=(n,t,fn)=>{if(u>=t&&!f.evL[n]){f.evL[n]=1;fn();}};
 const Wa=lsW(a),Wb=lsW(b),S=strong?1.5:1;
 go('a',0,()=>beep(1300,.08,'square',.06,400));go('o',.4,()=>beep(420,.14,'square',.07,180));go('x',1.2,()=>beep(700,.1,'sine',.06,1200));
 go('snap',2.2,()=>{beep(1800,.04,'square',.12,900);setTimeout(()=>beep(220,.08,'square',.16,90),40);G.stop=.04;f.t+=.04;G.shake=Math.max(G.shake,2);const n=strong?5:4;for(let i=0;i<n;i++){const an=rnd(0,TAU),vv=rnd(70,150);RFX.push({k:'sp',x:P.x+Math.cos(an)*Wb*.3,y:P.y+Math.sin(an)*Wb*.2,vx:Math.cos(an)*vv,vy:Math.sin(an)*vv,life:.25,max:.25,s:rnd(1.6,2.4),c:i%2?'#FFE07A':'#FF982D'});}if(strong){beep(90,.35,'sawtooth',.18,45);setTimeout(()=>{G.shake=Math.max(G.shake,2);},120);}});
 go('st',2.45,()=>{for(let i=0;i<5;i++){const x=P.x+rnd(-.35,.35)*Wb,y=P.y+rnd(-.1,.25)*Wb*.6;RFX.push({k:'sp',x,y,vx:rnd(-12,12),vy:rnd(-45,-25),life:.5,max:.5,s:rnd(3,4.5),c:'rgba(235,235,230,.75)'});}beep(260,.18,'noise'in{}?'sine':'triangle',.04,120);});
 /* anticipation */const sq=u<.4?Math.sin(cl(0,.4)*Math.PI)*.06:0;
 /* open amount */const op=u<.4?0:u<1.2?eo(cl(.4,1.2)):u<1.6?1:1-eo(cl(1.6,2.2));
 const xf=cl(1.2,1.6);/* crossfade A->B */
 const bounce=u<2.4?0:Math.sin(cl(2.4,3)*Math.PI*2)*(1-cl(2.4,3))*.05;
 const W=Wa+(Wb-Wa)*xf,dx=W*.12*S*op,rot=.08*S*op;
 cx.save();cx.translate(P.x,P.y);{const r0=W*.42,g=cx.createRadialGradient(0,2,r0*.3,0,2,r0*1.15);g.addColorStop(0,'rgba(0,0,0,.34)');g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.beginPath();cx.ellipse(0,2,r0*1.15,r0*.8,0,0,TAU);cx.fill();}
 /* small gold cover glow (not full-screen) */const ga=(u<.4?cl(0,.4)*.35:u<2.2?.35+.25*op:.35*(1-cl(2.2,2.6)))+.35*Math.max(0,1-Math.abs(u-1.35)/.15);if(ga>0){const g=cx.createRadialGradient(0,-W*.1,W*.1,0,-W*.1,W*.85);g.addColorStop(0,'rgba(255,214,110,'+ga+')');g.addColorStop(1,'rgba(255,190,70,0)');cx.fillStyle=g;cx.beginPath();cx.arc(0,-W*.1,W*.85,0,TAU);cx.fill();}
 cx.scale(1+sq-bounce,1-sq+bounce);
 const lift=strong?-W*.18*op*(u>1.2?1:0):0;
 const mk=(al,riseY)=>[{x:-dx,y:-W*.03*op+riseY,r:-rot,a:al},{x:0,y:-W*.08*op+riseY,r:0,a:al},{x:dx,y:-W*.03*op+riseY,r:rot,a:al}];
 const aA=1-SS(cl(1.2,1.4)),aB=SS(cl(1.3,1.5));if(aA>0)lsDraw(a,W,fl,{slices:mk(aA,0)});if(aB>0)lsDraw(b,W,fl,{slices:mk(aB,lift)});
 /* gold glow cracks over current sprite during anticipation */if(u<.55){const ca=u<.4?cl(.05,.4):1-cl(.4,.55),H=W*.9;cx.save();if(fl===1)cx.scale(-1,1);cx.translate(0,-H*.12);cx.strokeStyle='rgba(255,214,90,'+(.9*ca)+')';cx.lineWidth=Math.max(1.2,W*.018);cx.shadowColor='rgba(255,200,60,.9)';cx.shadowBlur=6;cx.lineCap='round';
  for(const k of[-1,1]){const x0=k*W/6;cx.beginPath();cx.moveTo(x0,-H*.35);cx.lineTo(x0+W*.03,-H*.15);cx.lineTo(x0-W*.02,0);cx.lineTo(x0+W*.025,H*.18);cx.lineTo(x0,H*.32);cx.stroke();}cx.restore();}
 cx.restore();}
// ===== v54 Lv20 '왕관 개화 포격요새': 4 blooming armour plates, 2 side gun pods, front triple barrel; 전면 집중 포격 =====
const W20F={sL:1,sR:1,ext:1,fr:1,rr:1,bloom:1,pod:1,tri:1,trS:0,lock:1,chg:0,muz:1,aim:0,rec:0,podRec:0};
